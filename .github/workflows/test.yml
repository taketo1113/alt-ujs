name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Node.js ${{ matrix.node-version }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    # Work around an error with Node.js v22 and Vitest 4.x
    # https://github.com/npm/cli/issues/9787
    - name: Update npm (for Node.js v22)
      if: matrix.node-version == '22.x'
      run: npm install --global npm@11
    - run: npm i
    - run: npm run lint
    - run: npm test
